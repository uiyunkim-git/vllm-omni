version: '3.9'

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: vllm_omni_tailscale
    hostname: vllm-omni-proxy
    restart: unless-stopped
    env_file: .env.central
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=vllm-omni-proxy
      - TS_EXTRA_ARGS=--reset
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    # Wrap default entrypoint to add a MASQUERADE rule on the tailscale interface
    # once it's up, so containers using this container as a gateway for the
    # tailnet subnet (100.64.0.0/10) get their return traffic NAT'd correctly.
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          for i in $$(seq 1 60); do
            if ip link show tailscale0 >/dev/null 2>&1; then
              iptables -t nat -C POSTROUTING -o tailscale0 -j MASQUERADE 2>/dev/null \
                || iptables -t nat -A POSTROUTING -o tailscale0 -j MASQUERADE
              echo "tailscale0 MASQUERADE rule installed"
              break
            fi
            sleep 1
          done
        ) &
        exec /usr/local/bin/containerboot
    ports:
      - "8080:8080"
    networks:
      vllm_network:
        aliases:
          - tailscale

  vllm_router_p2c:
    build:
      context: ./central/router
      dockerfile: Dockerfile.router
    container_name: vllm_omni_router_p2c
    restart: unless-stopped
    depends_on:
      - tailscale
    cap_add:
      - NET_ADMIN
    ports:
      - "11434:8080"
      - "29000:29000"
    environment:
      - ROUTER_STATE_FILE=/var/lib/vllm-router/workers.json
      - TAILSCALE_GATEWAY_HOST=tailscale
      - TAILSCALE_SUBNET=100.64.0.0/10
    volumes:
      - router-state:/var/lib/vllm-router
    entrypoint:
      - /bin/sh
      - -c
      - |
        GW=$$(getent hosts $${TAILSCALE_GATEWAY_HOST} | awk '{print $$1}')
        if [ -n "$$GW" ]; then
          echo "Adding route $${TAILSCALE_SUBNET} via $$GW (tailscale gateway)"
          ip route replace $${TAILSCALE_SUBNET} via $$GW || echo "route add failed (non-fatal)"
        else
          echo "WARN: tailscale host not resolvable, skipping route setup"
        fi
        exec "$$@"
      - "--"
    command: >
      vllm-router
      --host 0.0.0.0
      --port 8080
      --prometheus-host 0.0.0.0
      --prometheus-port 29000
      --policy least_connections
      --max-concurrent-requests 16384
      --retry-max-retries 2
      --cb-failure-threshold 30
      --cb-timeout-duration-secs 20
    networks:
      vllm_network:

  # ── Dynamo data plane ────────────────────────────────────────────────────
  # etcd: service discovery for `dynamo.vllm` workers on every host (they register
  # here; the frontend watches it). Single node is fine — it holds only leases.
  etcd:
    image: quay.io/coreos/etcd:v3.5.21
    container_name: vllm_omni_etcd
    restart: unless-stopped
    command: >
      /usr/local/bin/etcd
      --name vllm-omni
      --data-dir /etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --advertise-client-urls http://143.248.74.105:2379
      --listen-peer-urls http://0.0.0.0:2380
      --auto-compaction-retention 1h
    ports:
      - "2379:2379"
    volumes:
      - etcd-data:/etcd-data
    networks:
      vllm_network:

  # Dynamo frontend: OpenAI-compatible ingress (Rust) + KV-aware router over all
  # dynamo workers discovered in etcd. Replaces vllm_router_p2c once every model
  # has moved to engine=dynamo (then this takes :11434). Same tailscale-route
  # trick as the router so workers reachable only over the tailnet still work.
  dynamo_frontend:
    image: nvcr.io/nvidia/ai-dynamo/vllm-runtime:1.4.2
    container_name: vllm_omni_dynamo_frontend
    restart: unless-stopped
    depends_on:
      - tailscale
      - etcd
    cap_add:
      - NET_ADMIN
    user: "0:0"
    ports:
      # 11434 is the public inference port (moved here from vllm_router_p2c at the cutover).
      - "${DYNAMO_FRONTEND_PORT:-11434}:8080"
    environment:
      - HOME=/root
      - DYN_DISCOVERY_BACKEND=etcd
      - ETCD_ENDPOINTS=http://etcd:2379
      # No DYN_NAMESPACE here on purpose: the frontend stays UNscoped so it discovers
      # every model. Each served model lives in its own namespace
      # (`dynamo-<slug>`, see CentralManager._dynamo_namespace) because Dynamo allows
      # one model per (namespace, component, endpoint).
      - DYN_LOG=${DYNAMO_LOG:-info}
      - TAILSCALE_GATEWAY_HOST=tailscale
      - TAILSCALE_SUBNET=100.64.0.0/10
    entrypoint:
      - /bin/sh
      - -c
      - |
        GW=$$(getent hosts $${TAILSCALE_GATEWAY_HOST} | awk '{print $$1}')
        if [ -n "$$GW" ]; then
          echo "Adding route $${TAILSCALE_SUBNET} via $$GW (tailscale gateway)"
          ip route replace $${TAILSCALE_SUBNET} via $$GW || echo "route add failed (non-fatal)"
        else
          echo "WARN: tailscale host not resolvable, skipping route setup"
        fi
        exec "$$@"
      - "--"
    command: >
      python3 -m dynamo.frontend
      --http-port 8080
      --namespace-prefix ${DYNAMO_NAMESPACE:-dynamo}
      --router-mode ${DYNAMO_ROUTER_MODE:-kv}
      --kv-cache-block-size ${DYNAMO_KV_BLOCK_SIZE:-64}
      --migration-limit ${DYNAMO_MIGRATION_LIMIT:-3}
    networks:
      vllm_network:

  central:
    build:
      context: ./central
    container_name: vllm_omni_central
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    env_file: .env.central
    environment:
      # Host path of the git checkout, so central can compute the target commit
      # (via a throwaway git container) and workers can self-update to it.
      - HOST_REPO_DIR=${PWD}
      # Real git dir when the checkout is a submodule/worktree (empty for a
      # plain clone). Compute with: git rev-parse --git-common-dir (absolute).
      - HOST_GIT_DIR=${HOST_GIT_DIR:-}
      - WORKER_BRANCH=${WORKER_BRANCH:-main}
      # Opt-in rolling auto-update of drifted, idle workers. Default OFF.
      - WORKER_AUTO_UPDATE=${WORKER_AUTO_UPDATE:-0}
      # Dynamo data plane (engine=dynamo deployments)
      - DYNAMO_ETCD_ENDPOINTS=${DYNAMO_ETCD_ENDPOINTS:-http://143.248.74.105:2379}
      - DYNAMO_NAMESPACE=${DYNAMO_NAMESPACE:-dynamo}
      - DYNAMO_KV_BLOCK_SIZE=${DYNAMO_KV_BLOCK_SIZE:-64}
      - DYNAMO_FRONTEND_URL=${DYNAMO_FRONTEND_URL:-http://143.248.74.105:11434}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./central/main.py:/app/main.py
      - ./central/manager.py:/app/manager.py
      - ./central/frontend/static:/app/frontend/static
      - ./central/frontend:/app/frontend
      - ./central/data:/app/data

volumes:
  tailscale-state:
  router-state:
  etcd-data:

networks:
  vllm_network:
    external: true
    name: vllm_default
