version: '3.9'

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: vllm_omni_tailscale
    hostname: vllm-omni-proxy
    restart: unless-stopped
    env_file: .env.central
    environment:
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_USERSPACE=false
      - TS_HOSTNAME=vllm-omni-proxy
      - TS_EXTRA_ARGS=--reset
    volumes:
      - tailscale-state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv6.conf.all.forwarding=1
    # Wrap default entrypoint to add a MASQUERADE rule on the tailscale interface
    # once it's up, so containers using this container as a gateway for the
    # tailnet subnet (100.64.0.0/10) get their return traffic NAT'd correctly.
    entrypoint:
      - /bin/sh
      - -c
      - |
        (
          for i in $$(seq 1 60); do
            if ip link show tailscale0 >/dev/null 2>&1; then
              iptables -t nat -C POSTROUTING -o tailscale0 -j MASQUERADE 2>/dev/null \
                || iptables -t nat -A POSTROUTING -o tailscale0 -j MASQUERADE
              echo "tailscale0 MASQUERADE rule installed"
              break
            fi
            sleep 1
          done
        ) &
        exec /usr/local/bin/containerboot
    ports:
      - "8080:8080"
    networks:
      vllm_network:
        aliases:
          - tailscale

  vllm_router_p2c:
    build:
      context: ./central/router
      dockerfile: Dockerfile.router
    container_name: vllm_omni_router_p2c
    restart: unless-stopped
    depends_on:
      - tailscale
    cap_add:
      - NET_ADMIN
    ports:
      - "11434:8080"
      - "29000:29000"
    environment:
      - ROUTER_STATE_FILE=/var/lib/vllm-router/workers.json
      - TAILSCALE_GATEWAY_HOST=tailscale
      - TAILSCALE_SUBNET=100.64.0.0/10
    volumes:
      - router-state:/var/lib/vllm-router
    entrypoint:
      - /bin/sh
      - -c
      - |
        GW=$$(getent hosts $${TAILSCALE_GATEWAY_HOST} | awk '{print $$1}')
        if [ -n "$$GW" ]; then
          echo "Adding route $${TAILSCALE_SUBNET} via $$GW (tailscale gateway)"
          ip route replace $${TAILSCALE_SUBNET} via $$GW || echo "route add failed (non-fatal)"
        else
          echo "WARN: tailscale host not resolvable, skipping route setup"
        fi
        exec "$$@"
      - "--"
    command: >
      vllm-router
      --host 0.0.0.0
      --port 8080
      --prometheus-host 0.0.0.0
      --prometheus-port 29000
      --policy least_connections
      --max-concurrent-requests 16384
      --retry-max-retries 2
      --cb-failure-threshold 30
      --cb-timeout-duration-secs 20
    networks:
      vllm_network:

  central:
    build:
      context: ./central
    container_name: vllm_omni_central
    restart: unless-stopped
    network_mode: "service:tailscale"
    depends_on:
      - tailscale
    env_file: .env.central
    environment:
      # Host path of the git checkout, so central can compute the target commit
      # (via a throwaway git container) and workers can self-update to it.
      - HOST_REPO_DIR=${PWD}
      # Real git dir when the checkout is a submodule/worktree (empty for a
      # plain clone). Compute with: git rev-parse --git-common-dir (absolute).
      - HOST_GIT_DIR=${HOST_GIT_DIR:-}
      - WORKER_BRANCH=${WORKER_BRANCH:-main}
      # Opt-in rolling auto-update of drifted, idle workers. Default OFF.
      - WORKER_AUTO_UPDATE=${WORKER_AUTO_UPDATE:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./central/main.py:/app/main.py
      - ./central/manager.py:/app/manager.py
      - ./central/frontend/static:/app/frontend/static
      - ./central/frontend:/app/frontend
      - ./central/data:/app/data

volumes:
  tailscale-state:
  router-state:

networks:
  vllm_network:
    external: true
    name: vllm_default
