version: '3.9'

services:
  worker:
    build:
      context: ./worker
    container_name: vllm_omni_worker_1
    restart: unless-stopped
    ports:
      - "8085:8085"
    env_file: .env.worker
    environment:
      - HOST_DATA_DIR=${PWD}/worker/data
      # Host path of this git checkout — the self-updater mounts it to pull +
      # rebuild. Must be the real host path (compose bind-mounts resolve on the
      # host daemon), hence ${PWD} at `compose up` time.
      - HOST_REPO_DIR=${PWD}
      # Real git dir when this checkout is a submodule/worktree (empty for a
      # plain clone). Compute with: git rev-parse --git-common-dir (absolute).
      - HOST_GIT_DIR=${HOST_GIT_DIR:-}
      - WORKER_BRANCH=${WORKER_BRANCH:-main}
      # Shared secret this agent requires on its control API. Unset = open (so a
      # host that has not been given the key yet keeps working); set it in .env.
      - WORKER_API_KEY=${OMNI_API_KEY:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./worker/main.py:/app/main.py
      - ./worker/manager.py:/app/manager.py
      - ./worker/templates:/app/templates
      - ./worker/data:/app/data
      - /home/uiyunkim/.cache/huggingface:/home/uiyunkim/.cache/huggingface
    networks:
      - vllm_network

networks:
  vllm_network:
    external: true
    name: vllm_default
