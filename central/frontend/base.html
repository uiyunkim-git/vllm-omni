<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>vLLM Omni Platform</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { background-color: #f0f2f5; font-size: 15px; }
        .small, small { font-size: .875rem !important; }
        .form-text { font-size: .8rem !important; }

        /* Navbar */
        .navbar {
            border-bottom: 1px solid rgba(255,255,255,.08);
        }

        .card {
            border: 1px solid #e5e7eb;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,.06) !important;
        }
        .card-header {
            background: transparent;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 600;
            padding: .6rem 1rem;
        }

        /* Stat pill badges */
        .stat-active { background: #d1fae5; color: #065f46; }
        .stat-idle   { background: #f3f4f6; color: #6b7280; }
        .stat-rps    { background: #dbeafe; color: #1d4ed8; }

        .throughput-chart-card .card-body { padding: .85rem 1rem 1rem; }
        .throughput-chart-wrap { position: relative; height: 260px; min-height: 220px; }
        @media (max-width: 767.98px) { .throughput-chart-wrap { height: 220px; } }

        /* Table inside card */
        .table-card { border-radius: 10px; overflow: hidden; }
        .table-card .table { margin: 0; }
        .table-card .table tbody tr:last-child td { border-bottom: none; }
        .table-card .table td { padding: .65rem 1rem; vertical-align: middle; }

        /* GPU bar */
        .gpu-bar { height: 6px; border-radius: 3px; }

        /* Config row hover */
        .config-row:hover { background: #f8f9fa; }

        .section-title {
            font-size: .8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .07em;
            color: #6b7280;
            margin-bottom: 1rem;
            padding-bottom: .5rem;
            border-bottom: 1px solid #e5e7eb;
        }
        .table th { font-size: .875rem; font-weight: 600; }
        .table td { font-size: .9375rem; }

        /* GPU checkbox cards in deploy modal */
        .gpu-checkbox-label {
            display: inline-block;
            width: 90px;
            flex-shrink: 0;
            padding: 6px 8px;
            border: 1px solid #e5e7eb;
            border-radius: 7px;
            cursor: pointer;
            background: #fff;
            transition: border-color .15s, background .15s;
            overflow: hidden;
        }
        .gpu-checkbox-label:hover { border-color: #3b82f6; background: #eff6ff; }
        .btn-check:checked + .gpu-checkbox-label {
            border-color: #3b82f6;
            background: #eff6ff;
            box-shadow: 0 0 0 2px #bfdbfe;
        }

        /* Frontend status strip (dashboard) — wraps instead of scrolling */
        .stat-strip {
            display: flex;
            flex-wrap: wrap;
            gap: .75rem 2rem;
            padding: .85rem 1rem;
        }
        .stat-item { min-width: 96px; }
        .stat-item .val { font-size: 1.25rem; font-weight: 700; line-height: 1.15; word-break: break-all; }
        .stat-item .lbl {
            font-size: .7rem; font-weight: 600; text-transform: uppercase;
            letter-spacing: .06em; color: #6b7280;
        }
        .stat-item-url { flex: 1 1 240px; min-width: 0; }
        .status-dot {
            display: inline-block; width: 8px; height: 8px;
            border-radius: 50%; margin-right: 6px; vertical-align: middle;
        }
        .st-dot-wrap { display: inline-flex; align-items: center; }
        .fe-model-list { border-top: 1px solid #e5e7eb; }
        .fe-model-row {
            display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
            padding: .4rem 1rem; border-bottom: 1px solid #f1f3f5;
        }
        .fe-model-row:last-child { border-bottom: none; }
        .fe-model-row > .font-monospace { flex: 1 1 220px; min-width: 0; }

        /* Deployment lists, grouped by host (dashboard) */
        .dep-host-head {
            display: flex; align-items: center; gap: .5rem; flex-wrap: wrap;
            padding: .55rem .85rem; cursor: pointer; user-select: none;
            border-bottom: 1px solid #e5e7eb;
        }
        .dep-host-head:hover { background: #f9fafb; }
        .inst-table td, .inst-table th { padding: .45rem .75rem; vertical-align: middle; }
        .inst-table tbody tr:last-child td { border-bottom: none; }
        .dep-head-row td { background: #f8fafc; border-top: 1px solid #e2e8f0; }
        .dep-head { display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
        .dep-head-meta { font-size: .75rem; color: #94a3b8; margin-top: .2rem; word-break: break-word; }

        /* GPU list rows (dashboard) */
        .gpu-list-group { margin-bottom: 1rem; }
        .gpu-list-head {
            display: flex;
            align-items: center;
            gap: .5rem;
            padding: .55rem .85rem;
            cursor: pointer;
            user-select: none;
            border-bottom: 1px solid #e5e7eb;
        }
        .gpu-list-head:hover { background: #f9fafb; }
        .gpu-list-body { }
        /* flex-wrap (not a fixed-width grid) so rows shrink to the container
           and wrap instead of forcing horizontal scroll on narrow screens. */
        .gpu-list-row {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: .3rem .7rem;
            padding: .5rem .85rem;
            border-bottom: 1px solid #f1f3f5;
        }
        .gpu-list-row:last-child { border-bottom: none; }
        .gpu-list-row:hover { background: #f9fafb; }
        .gpu-list-row > :first-child { flex: 0 0 auto; }   /* "GPU {id}" label */
        .gpu-list-name {
            flex: 1 1 140px;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: .85rem;
            color: #4b5563;
        }
        .gpu-list-membar {
            flex: 1 1 80px;
            max-width: 180px;
            height: 6px;
            border-radius: 3px;
            background: #e5e7eb;
            overflow: hidden;
        }
        .gpu-list-membar > div { height: 100%; border-radius: 3px; transition: width .4s; }
        .gpu-list-mem {
            flex: 0 0 auto;
            font-size: .78rem;
            color: #6b7280;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }
        .gpu-list-util {
            flex: 0 0 auto;
            margin-left: auto;
            font-size: .78rem;
            color: #9ca3af;
            text-align: right;
            font-variant-numeric: tabular-nums;
            white-space: nowrap;
        }

        /* Active endpoint list rows */
        .ep-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
            flex-wrap: wrap;
            padding: .75rem 1rem;
            border-bottom: 1px solid #f1f3f5;
        }
        .ep-row:last-child { border-bottom: none; }
        .ep-row:hover { background: #f9fafb; }
        .ep-row-info { min-width: 0; flex: 1 1 260px; }
        .ep-row-title { display: flex; align-items: center; gap: .4rem; flex-wrap: wrap; }
        .ep-row-meta {
            display: flex;
            gap: .75rem;
            flex-wrap: wrap;
            margin-top: .25rem;
            font-size: .78rem;
        }
        .ep-row-actions { display: flex; gap: .5rem; flex-wrap: wrap; }

        /* Page content spacing */
        .page-content {
            padding-top: 1.5rem;
            padding-bottom: 3rem;
        }

        /* Toast-style alert container */
        #alert-container {
            position: fixed;
            top: 1rem;
            right: 1rem;
            z-index: 9999;
            width: 320px;
        }

        /* Modal polish */
        .modal-content {
            border: none;
            border-radius: 14px;
            overflow: hidden;
        }
        .modal-header {
            border-bottom: none;
            padding: 1.5rem 1.5rem 0.5rem;
        }
        .modal-footer {
            border-top: none;
            padding: 0.5rem 1.5rem 1.5rem;
        }

        {% block extra_styles %}{% endblock %}
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-xl">
            <a class="navbar-brand fw-bold" href="/"><i class="fa-solid fa-server me-2"></i>OmniServe</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0 nav-pills gap-2">
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'dashboard' %}active{% endif %}" href="/">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'configs' %}active{% endif %}" href="/configs">Configs</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'endpoints' %}active{% endif %}" href="/endpoints">Hosts</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'gateway' %}active{% endif %}" href="/gateway"><i class="fa-solid fa-code me-1"></i>API</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link {% if active_tab == 'metrics' %}active{% endif %}" href="/metrics"><i class="fa-solid fa-chart-line me-1"></i>Metrics</a>
                    </li>
                </ul>
                <a href="/deploy" class="btn btn-primary ms-2">
                    <i class="fa-solid fa-rocket me-1"></i>New Deployment
                </a>
            </div>
        </div>
    </nav>

    <div class="container-xl page-content">
        <div id="alert-container"></div>
        {% block content %}{% endblock %}
    </div>

    {% include 'modals.html' %}

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        window.activeTab = "{{ active_tab }}";
    </script>
    <script src="/static/app.js"></script>
    {% block extra_scripts %}{% endblock %}
</body>

</html>
