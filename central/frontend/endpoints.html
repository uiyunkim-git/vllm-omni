{% extends 'base.html' %}

{% block content %}
<div class="d-flex align-items-center mb-4">
    <i class="fa-solid fa-diagram-project me-2 text-secondary"></i>
    <div>
        <h4 class="fw-bold mb-0">Hosts</h4>
        <p class="text-muted small mb-0 mt-1">
            워커 에이전트가 등록된 GPU 호스트. 인스턴스는 여기 pull 된 엔진 이미지
            (<span class="font-monospace">nvcr.io/nvidia/ai-dynamo/vllm-runtime:*</span>)로 실행됩니다.
        </p>
    </div>
</div>

<!-- Pending Registration -->
<div class="mb-5">
    <div class="section-title">
        <i class="fa-solid fa-clock me-1"></i>Pending Registration
    </div>
    <div class="row g-3" id="pending-endpoints-container">
        <!-- Populated by JS -->
    </div>
</div>

<!-- Active Endpoints -->
<div class="mb-4">
    <div class="section-title">
        <i class="fa-solid fa-circle-check me-1"></i>Active Hosts
    </div>
    <div class="card table-card">
        <div id="active-endpoints-container">
            <!-- Populated by JS -->
        </div>
    </div>
</div>

<!-- Worker Versions / Updates -->
<div class="mb-4">
    <div class="section-title">
        <i class="fa-solid fa-code-branch me-1"></i>Worker Versions
    </div>
    <div class="card table-card">
        <div id="worker-versions-container">
            <p class="text-muted p-3 mb-0">Loading version info...</p>
        </div>
    </div>
</div>
{% endblock %}
