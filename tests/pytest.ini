[pytest]
# Default collection is the offline unit layer: no docker, no network, no GPU.
# `pytest integration` (loopback only) and `pytest e2e` (RUN_LIVE=1, live stack)
# are opt-in, see run_tests.sh.
testpaths = unit
asyncio_mode = auto
addopts = -ra
markers =
    unit: pure offline tests — no docker, no sockets, no cluster
    integration: central control plane vs. the mock worker agent over loopback
    live: opt-in checks against a running stack (requires RUN_LIVE=1)
